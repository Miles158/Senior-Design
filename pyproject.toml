[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-design"
version = "0.1.0"
description = "Outer Space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.*",
    "numpy",
    "h5py",
    "scikit-learn",
    "matplotlib",
    "sionna",
    "gymnasium",
    "stable-baselines3",
]

[tool.setuptools.packages.find]
where = ["src"]